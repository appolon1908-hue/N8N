name: codestra-n8n-staging-template

x-n8n-common: &n8n-common
  image: ${N8N_IMAGE:?N8N_IMAGE must be an immutable image reference by digest}
  profiles:
    - staging-after-runtime-verification
  restart: "no"
  user: "1000:1000"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  stop_grace_period: 30s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  environment: &n8n-environment
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
    DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
    DB_POSTGRESDB_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
    DB_POSTGRESDB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
    QUEUE_BULL_REDIS_PORT: ${REDIS_PORT:-6379}
    QUEUE_BULL_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
    N8N_HOST: ${N8N_PUBLIC_HOST:?N8N_PUBLIC_HOST is required}
    N8N_PORT: "5678"
    N8N_PROTOCOL: https
    WEBHOOK_URL: ${N8N_WEBHOOK_URL:?N8N_WEBHOOK_URL is required}
    N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?N8N_EDITOR_BASE_URL is required}
    N8N_PROXY_HOPS: "1"
    N8N_SECURE_COOKIE: "true"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    N8N_TEMPLATES_ENABLED: "false"
    N8N_COMMUNITY_PACKAGES_ENABLED: "false"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    NODE_FUNCTION_ALLOW_BUILTIN: ""
    NODE_FUNCTION_ALLOW_EXTERNAL: ""
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    EXECUTIONS_DATA_SAVE_ON_ERROR: all
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    N8N_METRICS: "true"
    N8N_LOG_LEVEL: info
  secrets:
    - n8n_encryption_key
    - postgres_password
    - redis_password
  volumes:
    - n8n_data:/home/node/.n8n
  networks:
    - middleware_network
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  n8n-main:
    <<: *n8n-common
    expose:
      - "5678"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  n8n-worker:
    <<: *n8n-common
    command:
      - worker
      - --concurrency=${N8N_WORKER_CONCURRENCY:-5}

volumes:
  n8n_data:
    name: ${N8N_DATA_VOLUME:?N8N_DATA_VOLUME must be verified before use}

networks:
  middleware_network:
    external: true
    name: ${MIDDLEWARE_NETWORK:?MIDDLEWARE_NETWORK must be verified before use}

secrets:
  n8n_encryption_key:
    external: true
    name: ${N8N_ENCRYPTION_SECRET_NAME:?N8N encryption secret must be provisioned outside Git}
  postgres_password:
    external: true
    name: ${POSTGRES_PASSWORD_SECRET_NAME:?PostgreSQL secret must be provisioned outside Git}
  redis_password:
    external: true
    name: ${REDIS_PASSWORD_SECRET_NAME:?Redis secret must be provisioned outside Git}
