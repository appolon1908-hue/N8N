name: deployment-preflight

on:
  workflow_dispatch:
    inputs:
      target:
        description: Validation target; this workflow never deploys
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deployment-preflight-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  preflight-only-no-deploy:
    name: Validate release evidence without deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out selected immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact source controls and Compose rendering
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q scripts ops tests
          make validate

      - name: Require verified runtime paths
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_runtime_paths.py --require-verified

      - name: Verify immutable release tuple
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_release_manifest.py \
            --path deploy/manifests/release.json \
            --target "${{ inputs.target }}"

      - name: Record non-deployment result
        run: |
          set -Eeuo pipefail
          echo "PREFLIGHT=PASS"
          echo "LIVE_SERVER_CHANGED=NO"
          echo "DEPLOYMENT_PERFORMED=NO"
