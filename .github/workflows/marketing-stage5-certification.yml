name: Marketing Stage 5 Certification

on:
  pull_request:
    paths:
      - 'workflows/marketing/**'
      - 'scripts/validate_marketing_workflows.py'
      - '.github/workflows/marketing-stage5-certification.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/validate_marketing_workflows.py
