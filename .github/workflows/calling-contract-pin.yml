name: calling-contract-pin

on:
  pull_request:
    paths:
      - ".codestra/calling-contract.lock.json"
      - ".github/workflows/calling-contract-pin.yml"
  push:
    branches: ["main"]
    paths:
      - ".codestra/calling-contract.lock.json"
      - ".github/workflows/calling-contract-pin.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enforce complete fail-closed calling contract lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          EXPECTED = {
              "schema_version": "codestra.calling-contract-lock.v1",
              "version": "1.0.0",
              "sha256": "b39cdffe56a8185c91174228f0423df68b1137f34875f6ee52f9914f904bf724",
              "authority": "appolon1908-hue/codestra-production-platform#257",
              "role": "automation",
              "external_effects_enabled": False,
          }

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def validate(document):
              if type(document) is not dict or set(document) != set(EXPECTED):
                  raise ValueError("calling contract lock field set mismatch")
              for field in ("schema_version", "version", "sha256", "authority", "role"):
                  if type(document[field]) is not str or document[field] != EXPECTED[field]:
                      raise ValueError(f"calling contract {field} mismatch")
              if document["external_effects_enabled"] is not False:
                  raise ValueError("external_effects_enabled must be JSON boolean false")
              if document != EXPECTED:
                  raise ValueError("calling contract lock mismatch")

          raw = Path(".codestra/calling-contract.lock.json").read_text(encoding="utf-8")
          actual = json.loads(raw, object_pairs_hook=reject_duplicates)
          validate(actual)

          for document in (
              {**EXPECTED, "external_effects_enabled": 0},
              {**EXPECTED, "external_effects_enabled": "false"},
              {**EXPECTED, "external_effects_enabled": True},
              {key: value for key, value in EXPECTED.items() if key != "schema_version"},
              {**EXPECTED, "unexpected": False},
          ):
              try:
                  validate(document)
              except ValueError:
                  continue
              raise SystemExit(f"invalid lock accepted: {document!r}")

          for sample in (
              '{"sha256":"wrong","sha256":"b39cdffe56a8185c91174228f0423df68b1137f34875f6ee52f9914f904bf724"}',
              '{"external_effects_enabled":true,"external_effects_enabled":false}',
          ):
              try:
                  json.loads(sample, object_pairs_hook=reject_duplicates)
              except ValueError:
                  continue
              raise SystemExit("duplicate-key fixture was accepted")

          print("CALLING_CONTRACT_LOCK=PASS")
          print("LOCK_SCHEMA=codestra.calling-contract-lock.v1")
          print("EXTERNAL_EFFECTS_ENABLED=false")
          PY
          git diff --check
