name: Export PR 38 exact source

on:
  push:
    branches:
      - chatgpt/pr38-validation-20260903

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create tracked source archive
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/n8n-pr38-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/n8n-pr38-source.tar.gz" > "$RUNNER_TEMP/n8n-pr38-source.tar.gz.sha256"
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n8n-pr38-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/n8n-pr38-source.tar.gz
            ${{ runner.temp }}/n8n-pr38-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
